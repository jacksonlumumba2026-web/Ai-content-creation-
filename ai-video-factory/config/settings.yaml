# AI Video Factory — default configuration
#
# This file is committed. Do NOT put secrets here.
#   - Secrets (API keys)       -> config/.env            (git-ignored, copy from .env.example)
#   - Personal overrides       -> config/settings.local.yaml (git-ignored, same shape as this file)
#   - One-off overrides        -> environment variables: AVF__SECTION__KEY=value
#                                 e.g. AVF__VIDEO__FPS=60
#
# Every provider defaults to "none" so nothing paid is ever called by accident.

project:
  name: ai-video-factory
  language: en
  niches:
    - ai
    - business
    - money
    - technology

# Target output spec shared by TikTok, YouTube Shorts and Instagram Reels.
video:
  width: 1080
  height: 1920          # 9:16 vertical
  fps: 30
  min_duration_sec: 30
  max_duration_sec: 60
  container: mp4
  video_codec: h264
  audio_codec: aac
  audio_sample_rate: 48000
  target_loudness_lufs: -14

branding:
  handle: "@jacksonwebsolutions"  # shown on screen; matches the TikTok account in Metricool

script:
  words_per_minute: 160       # ~80–160 words for a 30–60s video
  hook_max_sec: 3             # the first line must land within 3 seconds
  require_sources: true       # every factual claim needs a source in research/
  min_visuals: 3              # on-screen graphics per video (stat/list/compare/icon/text cards)
  require_human_review: true  # owner approves each post in the Metricool app before it goes live

captions:
  format: srt                 # srt | vtt | ass
  max_chars_per_line: 16      # ~16 bold caps fit across 1080px at font_size 86
  max_lines: 2
  max_words_per_cue: 4        # short, punchy cues read better on vertical video
  break_on_pause_sec: 0.35    # start a new cue after a pause this long
  font: "DejaVu Sans"         # bold weight is used; installed in this container
  uppercase: true             # punchy all-caps captions
  font_size: 86
  position_y: 1270            # caption centre (px); below the graphics card, clear of TikTok/Reels bottom UI

# Providers: which service does each job. "none" = step not wired up yet.
# Options listed in comments are candidates, not commitments.
providers:
  llm: claude_code            # scripts/research are written by Claude Code in-session
  tts: piper                  # none | ffmpeg_flite | piper | edge_tts | elevenlabs
  images: none                # none | stock_pexels | canva | elevenlabs
  stock_video: pexels         # none | pexels | pixabay (free Pexels API key: PEXELS_API_KEY)
  music: none                 # none | local_library
  transcription: whisper_local # none | whisper_local | elevenlabs
  render: ffmpeg              # none | ffmpeg | moviepy | descript
  publish: metricool          # none | manual | metricool | opusclip

# Local, free text-to-speech.
tts:
  fallback: ffmpeg_flite        # used when the piper voice isn't installed yet (none = fail instead)
  ffmpeg_flite:                 # zero-download fallback; sounds robotic — fine for drafts/timing
    voice: rms                  # male: rms (US, default) | awb (Scottish) | kal (US, low-fi); female: slt
  piper:                        # natural voices: https://rhasspy.github.io/piper-samples/
    voice: en_US-ryan-high      # confident male narrator; alt: en_US-lessac-medium, en_US-amy-medium
    length_scale: 0.95          # < 1.0 = faster speech (shorts benefit from brisk pacing)
    sentence_silence: 0.15      # seconds of pause between sentences
    volume: 1.0

# Stock footage behind the graphics (script front matter `scenes`). Without PEXELS_API_KEY or
# network access, videos fall back to the animated gradient background.
stock:
  min_clip_sec: 5             # skip clips shorter than this
  required: false             # true = fail the video instead of falling back to the gradient

# Speech-to-text, used only to time captions (words come from the script).
transcription:
  whisper_local:
    model: base.en              # tiny.en (fastest) | base.en | small.en (most accurate, slower)
    device: cpu
    compute_type: int8
    beam_size: 5

publishing:
  # Owner decision (2026-09-28): post to the Jackson web Solutions accounts, approving each
  # video from the Metricool phone app. auto_publish=false -> Metricool sends a push
  # notification at the scheduled time and the owner taps publish; nothing goes out unapproved.
  platforms:
    youtube_shorts:
      enabled: true
    tiktok:
      enabled: true
    facebook_reels:
      enabled: true
    instagram_reels:
      enabled: false          # connected in Metricool; not requested
  auto_publish: false         # false = approve each post in the Metricool app
  posts_per_day: 2           # owner decision 2026-09-28
  post_times: ["12:30", "18:30"]  # daily slots, Africa/Nairobi (lunch break + evening)
  timezone: Africa/Nairobi
  metricool_blog_id: "7036996"  # Metricool brand "Jackson web Solutions"
  media_branch: media         # public MP4 hosting (orphan branch, raw.githubusercontent.com)
  ai_disclosure: true         # sets the AI-generated flags on YouTube / TikTok / Instagram

# Relative to the ai-video-factory/ root.
paths:
  scripts: scripts
  research: research
  images: assets/images
  video: assets/video
  audio: assets/audio
  voiceovers: voiceovers
  captions: captions
  music: music
  output: output
  models: models             # downloaded model files (git-ignored)
